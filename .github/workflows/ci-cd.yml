# CI on pull requests; CI + deploy to Cloudflare Pages (primary) and GitHub Pages (backup) on main.
# See prompt-battle-kit/docs/DEPLOYMENT.md. Third-party actions are pinned to full commit SHAs.
#
# Repository settings needed:
#   secrets   CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit), CLOUDFLARE_ACCOUNT_ID
#   variables API_BASE_URL (e.g. https://<service>.up.railway.app)
#   Pages     Settings → Pages → Source: GitHub Actions
name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  DIST: dist/prompt-battle-ui/browser

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm run test:ci
      - run: npm run build
      # SPEC §14.2-3: Playwright smoke against the fake API (Chromium es/en × light/dark + WebKit).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright smoke
        run: npm run e2e
        env:
          NG_CLI_ANALYTICS: 'false'
      # Every player screen, demo and worst-case data: AXE, tap targets, 360/320 px reflow (D-024).
      - name: Playwright screens
        run: npm run e2e:screens
        env:
          NG_CLI_ANALYTICS: 'false'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7
      - name: Upload production build (base href /)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser
          path: ${{ env.DIST }}
          retention-days: 7

  deploy-cloudflare:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-pages
      url: https://prompt-battle-ui.pages.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser
          path: ${{ env.DIST }}
      - name: Write config.json from API_BASE_URL
        run: node scripts/write-config.mjs "$DIST" "$API_BASE_URL"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.165.0'
          command: pages deploy ${{ env.DIST }} --project-name=prompt-battle-ui --branch=main

  deploy-github-pages:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build with the backup base href
        run: npx ng build --base-href /prompt-battle-ui/
      - name: Deep links (404.html) and config.json
        run: |
          cp "$DIST/index.html" "$DIST/404.html"
          rm -f "$DIST/_headers"
          node scripts/write-config.mjs "$DIST" "$API_BASE_URL"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.DIST }}
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
