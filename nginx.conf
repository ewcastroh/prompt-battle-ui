# Single-page app on nginx (local Docker image). Mirrors public/_headers (Cloudflare Pages).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Runtime config (D-017) and translations: always revalidate.
    location = /config.json {
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /i18n/ {
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Content-hashed bundles never change.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Deep links (/play/mde, /stage/bog, /admin/mde) load the app; index.html is never cached.
    location / {
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri $uri/ /index.html;
    }
}
