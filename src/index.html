<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <!-- Status bar / browser chrome color = the header surface, per scheme (mobile-native §10). -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
      data-scheme="light"
    />
    <meta
      name="theme-color"
      content="#161b22"
      media="(prefers-color-scheme: dark)"
      data-scheme="dark"
    />
    <script>
      try {
        var stored = localStorage.getItem('color-scheme');
        document.querySelector('meta[name="color-scheme"]').content = stored ?? 'light dark';
        // A stored override also picks the matching theme-color (ThemeService keeps this in sync).
        if (stored === 'light' || stored === 'dark') {
          document.querySelectorAll('meta[name="theme-color"][data-scheme]').forEach(function (m) {
            m.media = m.dataset.scheme === stored ? 'all' : 'not all';
          });
        }
      } catch {}
    </script>
    <title>Prompt Battle</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="text-scale" content="scale" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="preload"
      href="fonts/atkinson-hyperlegible-next-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Declared here so the relative URLs resolve against <base href> (also under /prompt-battle-ui/). */
      @font-face {
        font-family: 'Atkinson Hyperlegible Next';
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url('fonts/atkinson-hyperlegible-next-latin-var.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url('fonts/jetbrains-mono-latin-var.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
  </head>
  <body>
    <pb-root></pb-root>
  </body>
</html>
